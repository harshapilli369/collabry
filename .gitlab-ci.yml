# GitLab CI/CD - Collabry
# develop branch: build, test, Designite/DCode, publish (dev tag), deploy to dev (port 8073).
# main branch: build, test, Designite/DCode, publish (latest), deploy to production (port 8073).
# MR pipelines: build, test, Designite/DCode (no publish/deploy unless branch rules match).
#
# Docker Hub rate limits: Uses CI variables DOCKERHUB_USER + DOCKERHUB_PASSWORD for authenticated pulls.
# Required: Add DOCKERHUB_USER and DOCKERHUB_PASSWORD in Settings → CI/CD → Variables (mask DOCKERHUB_PASSWORD).
#
# Designite submit needs CI/CD variables: DCODE_PROJECT_ID, DCODE_API_KEY (masked).
# Requires repo files: .quality/requirements.txt, .quality/push_to_dcode.py

include:
  - template: Jobs/Code-Quality.gitlab-ci.yml

stages:
  - build
  - test
  - run-dj
  - submit-dcode
  - publish
  - deploy

.dcode_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# --- Build: compile backend and frontend ---
# Use group04_Runner to avoid Docker Hub rate limits on shared autoscaler (runner may have cached images or auth)
build-backend:
  stage: build
  image: eclipse-temurin:17
  tags:
    - group04_Runner
  script:
    - cd backend
    - chmod +x mvnw
    - ./mvnw compile -B -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# Uses docker+dind + docker login so node image pull is authenticated (avoids rate limit)
build-frontend:
  stage: build
  image: docker:24
  tags:
    - group04_Runner
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  services:
    - docker:24-dind
  before_script:
    - |
      if [ -z "${DOCKERHUB_PASSWORD:-}" ]; then
        echo "ERROR: Set DOCKERHUB_PASSWORD in Settings → CI/CD → Variables to avoid Docker Hub rate limits."
        exit 1
      fi
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "${DOCKERHUB_USER:-hpilli369}" --password-stdin
  script:
    # Use /tmp for npm cache: default ~/.npm can hit EEXIST/rename races in docker run + bind mounts.
    - docker run --rm -v "$CI_PROJECT_DIR:/app" -w /app/frontend node:20-alpine sh -c "mkdir -p /tmp/npm-cache && npm ci --cache /tmp/npm-cache && npm run build"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# --- Test: run backend tests and coverage (mvn verify = test + JaCoCo report + optional coverage gate) ---
test:
  stage: test
  image: eclipse-temurin:17
  tags:
    - group04_Runner
  script:
    - cd backend
    - chmod +x mvnw
    # Optional: set COVERAGE_MIN_LINE / COVERAGE_MIN_BRANCH in CI/CD variables (e.g. 0.80) to fail if coverage drops below threshold
    - |
      if [ -n "${COVERAGE_MIN_LINE:-}" ] || [ -n "${COVERAGE_MIN_BRANCH:-}" ]; then
        ./mvnw verify -B -q -Djacoco.line.minimum="${COVERAGE_MIN_LINE:-0}" -Djacoco.branch.minimum="${COVERAGE_MIN_BRANCH:-0}"
      else
        ./mvnw verify -B -q
      fi
  artifacts:
    when: always
    paths:
      - backend/target/site/jacoco/
    reports:
      coverage_report:
        coverage_format: jacoco
        path: backend/target/site/jacoco/jacoco.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# --- DesigniteJava (code smells) + submit to DCode ---
run-dj-job:
  extends: .dcode_rules
  stage: run-dj
  image: openjdk:26-ea-jdk
  tags:
    - dalfcs_docker_kvm
  script:
    - echo "Downloading DesigniteJava"
    - curl -fsSL https://designite-tools.com/assets/DesigniteJava.jar -o DesigniteJava.jar
    - echo "Running DesigniteJava"
    - mkdir smells/
    - java -jar $CI_PROJECT_DIR/DesigniteJava.jar -i $CI_PROJECT_DIR -o $CI_PROJECT_DIR/smells/ -d
  artifacts:
    name: "designite-smells-$CI_COMMIT_SHORT_SHA"
    expose_as: "DesigniteJava Smell Reports"
    paths:
      - smells/
    expire_in: 4 weeks

submit-dcode-job:
  extends: .dcode_rules
  stage: submit-dcode
  image: python:3.10-alpine
  tags:
    - dalfcs_docker_kvm
  dependencies:
    - run-dj-job
  before_script:
    # Unset vars disappear in the shell and Python sees "wrong arg count". Fail clearly first.
    - |
      if [ -z "${DCODE_PROJECT_ID:-}" ] || [ -z "${DCODE_API_KEY:-}" ]; then
        echo "ERROR: DCODE_PROJECT_ID and DCODE_API_KEY must be non-empty in CI/CD Variables."
        echo "Merge request pipelines: if variables are marked Protected, they are omitted unless the source branch is protected — adjust or use unprotected variables for course MRs."
        exit 1
      fi
  script:
    - pip3 install -r $CI_PROJECT_DIR/.quality/requirements.txt
    - python3 $CI_PROJECT_DIR/.quality/push_to_dcode.py "$DCODE_PROJECT_ID" "$DCODE_API_KEY" "$CI_PROJECT_DIR/smells/" "$CI_COMMIT_SHA"

# --- Publish: build and push Docker image ---
# main -> latest + commit SHA; develop -> dev-latest + dev-SHA
publish:
  image: docker:24
  stage: publish
  tags:
    - group04_Runner
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  services:
    - docker:24-dind
  before_script:
    - |
      if [ -z "${DOCKERHUB_PASSWORD:-}" ]; then
        echo "ERROR: Set DOCKERHUB_PASSWORD in Settings → CI/CD → Variables for authenticated Docker Hub pulls."
        exit 1
      fi
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "${DOCKERHUB_USER:-hpilli369}" --password-stdin
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        API_URL="${VITE_API_BASE_URL:-http://csci5308-vm5.research.cs.dal.ca:8073/api/auth}"
        docker build --build-arg VITE_API_BASE_URL="$API_URL" --build-arg VITE_GOOGLE_CLIENT_ID="${VITE_GOOGLE_CLIENT_ID}" -t docker.io/hpilli369/group04:$CI_COMMIT_SHORT_SHA -t docker.io/hpilli369/group04:latest .
        docker push docker.io/hpilli369/group04:$CI_COMMIT_SHORT_SHA
        docker push docker.io/hpilli369/group04:latest
      else
        API_URL="${VITE_API_BASE_URL_DEV:-http://csci5308-vm5.research.cs.dal.ca:8073/api/auth}"
        docker build --build-arg VITE_API_BASE_URL="$API_URL" --build-arg VITE_GOOGLE_CLIENT_ID="${VITE_GOOGLE_CLIENT_ID}" -t docker.io/hpilli369/group04:dev-$CI_COMMIT_SHORT_SHA -t docker.io/hpilli369/group04:dev-latest .
        docker push docker.io/hpilli369/group04:dev-$CI_COMMIT_SHORT_SHA
        docker push docker.io/hpilli369/group04:dev-latest
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# --- Deploy to develop (develop branch, port 8073) ---
deploy-dev:
  image: alpine:latest
  stage: deploy
  tags:
    - group04_Runner
  script:
    - apk add --no-cache openssh-client
    - |
      if [ -z "${ID_RSA:-}" ] || [ -z "${SERVER_USER:-}" ] || [ -z "${SERVER_IP:-}" ]; then
        echo "ERROR: Required CI/CD variables missing. Add ID_RSA (File), SERVER_USER, SERVER_IP in Settings → CI/CD → Variables."
        exit 1
      fi
      if [ ! -f "$ID_RSA" ]; then
        echo "ERROR: ID_RSA must be a File-type variable. Change in Settings → CI/CD → Variables."
        exit 1
      fi
    - chmod 400 "$ID_RSA"
    - |
      ssh -i "$ID_RSA" -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" "
        echo \"$DOCKERHUB_PASSWORD\" | docker login -u \"${DOCKERHUB_USER:-hpilli369}\" --password-stdin &&
        docker pull docker.io/hpilli369/group04:dev-$CI_COMMIT_SHORT_SHA &&
        docker container rm -f my-app-dev my-app 2>/dev/null || true &&
        docker run -d -p 8073:8073 \
          -e APP_CONFIRMATION_BASE_URL=http://$SERVER_IP:8073 \
          -e SPRING_DATASOURCE_URL=\"jdbc:mysql://db-5308.cs.dal.ca:3306/CSCI5308_5_DEVINT\" \
          -e SPRING_DATASOURCE_USERNAME=\"CSCI5308_5_DEVINT_USER\" \
          -e SPRING_DATASOURCE_PASSWORD=\"${DB_PASSWORD:-}\" \
          -e SPRING_MAIL_HOST=\"${SPRING_MAIL_HOST:-}\" \
          -e SPRING_MAIL_PORT=\"${SPRING_MAIL_PORT:-465}\" \
          -e SPRING_MAIL_USERNAME=\"${SPRING_MAIL_USERNAME:-}\" \
          -e SPRING_MAIL_PASSWORD=\"${SPRING_MAIL_PASSWORD:-}\" \
          -e APP_MAIL_FROM=\"${APP_MAIL_FROM:-}\" \
          -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true \
          -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=false \
          -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE=\"${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE:-true}\" \
          -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST=\"${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST:-*}\" \
          -e GROQ_API_KEY=\"${GROQ_API_KEY:-}\" \
          -e CLOUDINARY_CLOUD_NAME=\"${CLOUDINARY_CLOUD_NAME:-}\" \
          -e CLOUDINARY_API_KEY=\"${CLOUDINARY_API_KEY:-}\" \
          -e CLOUDINARY_API_SECRET=\"${CLOUDINARY_API_SECRET:-}\" \
          --name my-app-dev --restart unless-stopped docker.io/hpilli369/group04:dev-$CI_COMMIT_SHORT_SHA
      "
  environment:
    name: develop
    url: http://csci5308-vm5.research.cs.dal.ca:8073
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# --- Deploy to production (main branch, port 8073) ---
deploy-prod:
  image: alpine:latest
  stage: deploy
  tags:
    - group04_Runner
  script:
    - apk add --no-cache openssh-client
    - chmod 400 "$ID_RSA"
    - |
      ssh -i "$ID_RSA" -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" "
        echo \"$DOCKERHUB_PASSWORD\" | docker login -u \"${DOCKERHUB_USER:-hpilli369}\" --password-stdin &&
        docker pull docker.io/hpilli369/group04:$CI_COMMIT_SHORT_SHA &&
        docker container rm -f my-app 2>/dev/null || true &&
        docker run -d -p 8073:8073 \
          -e APP_CONFIRMATION_BASE_URL=http://$SERVER_IP:8073 \
          -e SPRING_DATASOURCE_URL=\"jdbc:mysql://db-5308.cs.dal.ca:3306/CSCI5308_5_PRODUCTION\" \
          -e SPRING_DATASOURCE_USERNAME=\"CSCI5308_5_PRODUCTION_USER\" \
          -e SPRING_DATASOURCE_PASSWORD=\"${DB_PASSWORD:-}\" \
          -e SPRING_MAIL_HOST=\"${SPRING_MAIL_HOST:-}\" \
          -e SPRING_MAIL_PORT=\"${SPRING_MAIL_PORT:-465}\" \
          -e SPRING_MAIL_USERNAME=\"${SPRING_MAIL_USERNAME:-}\" \
          -e SPRING_MAIL_PASSWORD=\"${SPRING_MAIL_PASSWORD:-}\" \
          -e APP_MAIL_FROM=\"${APP_MAIL_FROM:-}\" \
          -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true \
          -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=false \
          -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE=\"${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE:-true}\" \
          -e SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST=\"${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_TRUST:-*}\" \
          -e GROQ_API_KEY=\"${GROQ_API_KEY:-}\" \
          -e CLOUDINARY_CLOUD_NAME=\"${CLOUDINARY_CLOUD_NAME:-}\" \
          -e CLOUDINARY_API_KEY=\"${CLOUDINARY_API_KEY:-}\" \
          -e CLOUDINARY_API_SECRET=\"${CLOUDINARY_API_SECRET:-}\" \
          --name my-app --restart unless-stopped docker.io/hpilli369/group04:$CI_COMMIT_SHORT_SHA
      "
  environment:
    name: production
    url: http://csci5308-vm5.research.cs.dal.ca:8073
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
