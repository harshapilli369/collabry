# GitLab CI/CD - Collabry
# develop branch: build, test, publish (dev tag), deploy to dev (port 8074).
# main branch: build, test, publish (latest), deploy to production (port 8073).

stages:
  - build
  - test
  - publish
  - deploy

# --- Build: compile backend and frontend ---
build-backend:
  stage: build
  image: eclipse-temurin:17
  script:
    - cd backend
    - chmod +x mvnw
    - ./mvnw compile -B -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

build-frontend:
  stage: build
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# --- Test: run backend tests ---
test:
  stage: test
  image: eclipse-temurin:17
  script:
    - cd backend
    - chmod +x mvnw
    - ./mvnw test -B -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# --- Publish: build and push Docker image ---
# main -> latest + commit SHA; develop -> dev-latest + dev-SHA
publish:
  image: docker:24
  stage: publish
  tags:
    - group04_Runner
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  services:
    - docker:24-dind
  before_script:
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "${DOCKERHUB_USER:-hpilli369}" --password-stdin
  script:
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        API_URL="${VITE_API_BASE_URL:-http://csci5308-vm2.research.cs.dal.ca:8073/api/auth}"
        docker build --build-arg VITE_API_BASE_URL="$API_URL" --build-arg VITE_GOOGLE_CLIENT_ID="${VITE_GOOGLE_CLIENT_ID}" -t docker.io/hpilli369/group04:$CI_COMMIT_SHORT_SHA -t docker.io/hpilli369/group04:latest .
        docker push docker.io/hpilli369/group04:$CI_COMMIT_SHORT_SHA
        docker push docker.io/hpilli369/group04:latest
      else
        API_URL="${VITE_API_BASE_URL_DEV:-http://csci5308-vm2.research.cs.dal.ca:8074/api/auth}"
        docker build --build-arg VITE_API_BASE_URL="$API_URL" --build-arg VITE_GOOGLE_CLIENT_ID="${VITE_GOOGLE_CLIENT_ID}" -t docker.io/hpilli369/group04:dev-$CI_COMMIT_SHORT_SHA -t docker.io/hpilli369/group04:dev-latest .
        docker push docker.io/hpilli369/group04:dev-$CI_COMMIT_SHORT_SHA
        docker push docker.io/hpilli369/group04:dev-latest
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# --- Deploy to develop (develop branch, port 8074) ---
deploy-dev:
  image: alpine:latest
  stage: deploy
  tags:
    - group04_Runner
  script:
    - apk add --no-cache openssh-client
    # #region agent log - deploy debug diagnostics
    - |
      echo "=== Deploy diagnostics (hypothesis A: missing vars) ==="
      echo "ID_RSA set: $([ -n \"${ID_RSA:-}\" ] && echo 'yes' || echo 'MISSING')"
      echo "SERVER_USER set: $([ -n \"${SERVER_USER:-}\" ] && echo 'yes' || echo 'MISSING')"
      echo "SERVER_IP set: $([ -n \"${SERVER_IP:-}\" ] && echo 'yes' || echo 'MISSING')"
      echo "=== Hypothesis B: ID_RSA file type ==="
      if [ -n "${ID_RSA:-}" ]; then
        echo "ID_RSA path exists as file: $([ -f \"$ID_RSA\" ] && echo 'yes' || echo 'no - may be Variable not File type')"
      fi
      echo "=== Hypothesis C/D: SSH destination (masked) ==="
      DEST="${SERVER_USER:-EMPTY}@${SERVER_IP:-EMPTY}"
      echo "Destination format: ${DEST}"
      if [ -z "${ID_RSA:-}" ] || [ -z "${SERVER_USER:-}" ] || [ -z "${SERVER_IP:-}" ]; then
        echo "ERROR: Required CI/CD variables missing. Add ID_RSA (File), SERVER_USER, SERVER_IP in Settings → CI/CD → Variables."
        echo "If variables are Protected, ensure 'develop' is a protected branch or add unprotected copies."
        exit 1
      fi
      if [ ! -f "$ID_RSA" ]; then
        echo "ERROR: ID_RSA must be a File-type variable (path to key), not Variable (key content). Change in Settings → CI/CD → Variables."
        exit 1
      fi
    # #endregion
    - chmod 400 "$ID_RSA"
    - |
      ssh -i "$ID_RSA" -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" "
        echo \"$DOCKERHUB_PASSWORD\" | docker login -u \"${DOCKERHUB_USER:-hpilli369}\" --password-stdin &&
        docker pull docker.io/hpilli369/group04:dev-$CI_COMMIT_SHORT_SHA &&
        docker container rm -f my-app-dev 2>/dev/null || true &&
        docker run -d -p 8074:8073 -e APP_CONFIRMATION_BASE_URL=http://csci5308-vm2.research.cs.dal.ca:8074 --name my-app-dev --restart unless-stopped docker.io/hpilli369/group04:dev-$CI_COMMIT_SHORT_SHA
      "
  environment:
    name: develop
    url: http://csci5308-vm2.research.cs.dal.ca:8074
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

# --- Deploy to production (main branch, port 8073) ---
deploy-prod:
  image: alpine:latest
  stage: deploy
  tags:
    - group04_Runner
  script:
    - chmod 400 "$ID_RSA"
    - apk add --no-cache openssh-client
    - |
      ssh -i "$ID_RSA" -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" "
        echo \"$DOCKERHUB_PASSWORD\" | docker login -u \"${DOCKERHUB_USER:-hpilli369}\" --password-stdin &&
        docker pull docker.io/hpilli369/group04:$CI_COMMIT_SHORT_SHA &&
        docker container rm -f my-app 2>/dev/null || true &&
        docker run -d -p 8073:8073 --name my-app --restart unless-stopped docker.io/hpilli369/group04:$CI_COMMIT_SHORT_SHA
      "
  environment:
    name: production
    url: http://csci5308-vm2.research.cs.dal.ca:8073
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
