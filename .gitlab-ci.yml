# GitLab CI/CD - Collabry
# Production deploys from main branch only.

stages:
  - build
  - test
  - publish
  - deploy

# --- Build: compile backend and frontend ---
build-backend:
  stage: build
  image: eclipse-temurin:17
  script:
    - cd backend
    - chmod +x mvnw
    - ./mvnw compile -B -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

build-frontend:
  stage: build
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# --- Test: run backend tests ---
test:
  stage: test
  image: eclipse-temurin:17
  script:
    - cd backend
    - chmod +x mvnw
    - ./mvnw test -B -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# --- Publish: build and push Docker image (main only) ---
publish:
  image: docker:24
  stage: publish
  tags:
    - group04_Runner
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  services:
    - docker:24-dind
  before_script:
    - echo "$DOCKERHUB_PASSWORD" | docker login -u "${DOCKERHUB_USER:-hpilli369}" --password-stdin
  script:
    - docker build
        --build-arg VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://csci5308-vm2.research.cs.dal.ca:8073/api/auth}
        --build-arg VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
        -t docker.io/hpilli369/group04:$CI_COMMIT_SHORT_SHA
        -t docker.io/hpilli369/group04:latest
        .
    - docker push docker.io/hpilli369/group04:$CI_COMMIT_SHORT_SHA
    - docker push docker.io/hpilli369/group04:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# --- Deploy: run on production server (main only) ---
deploy:
  image: alpine:latest
  stage: deploy
  tags:
    - group04_Runner
  script:
    - chmod 400 "$ID_RSA"
    - apk add --no-cache openssh-client
    - |
      ssh -i "$ID_RSA" -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_IP" "
        echo \"$DOCKERHUB_PASSWORD\" | docker login -u \"${DOCKERHUB_USER:-hpilli369}\" --password-stdin &&
        docker pull docker.io/hpilli369/group04:$CI_COMMIT_SHORT_SHA &&
        docker container rm -f my-app 2>/dev/null || true &&
        docker run -d -p 8073:8073 --name my-app --restart unless-stopped docker.io/hpilli369/group04:$CI_COMMIT_SHORT_SHA
      "
  environment:
    name: production
    url: http://csci5308-vm2.research.cs.dal.ca:8073
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
